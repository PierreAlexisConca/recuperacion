<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vallegrande - Registro de Equipos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>


<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-green-700 to-green-600 p-8 text-white relative">
                <div class="flex items-center justify-between gap-6">
                    <div>
                        <h1 class="text-4xl font-bold">Vallegrande</h1>
                        <p class="text-green-100 text-sm mt-1">Sistema de Registro de Equipos</p>
                    </div>
                    <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo Vallegrande"
                        class="logo-img">
                </div>
            </div>


            <!-- Form -->
            <form id="registroForm" class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


                    <!-- Columna Izquierda -->
                    <div class="space-y-4">
                        <!-- Código -->
                        <div>
                            <label for="codigo" class="block text-sm font-semibold text-gray-700 mb-2">
                                Código
                            </label>
                            <input type="text" id="codigo" name="codigo" placeholder="Ej: VG-001-2024"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                        </div>


                        <!-- Marca -->
                        <div>
                            <label for="marca" class="block text-sm font-semibold text-gray-700 mb-2">
                                Marca
                            </label>
                            <select id="marca" name="marca"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                                <option value="">Seleccionar...</option>
                                <option value="Dell">Dell</option>
                                <option value="HP">HP</option>
                                <option value="Lenovo">Lenovo</option>
                                <option value="ASUS">ASUS</option>
                                <option value="Apple">Apple</option>
                                <option value="Acer">Acer</option>
                                <option value="Cisco">Cisco</option>
                            </select>
                        </div>


                        <!-- Sistema Operativo -->
                        <div>
                            <label for="sistema_operativo" class="block text-sm font-semibold text-gray-700 mb-2">
                                Sistema Operativo
                            </label>
                            <select id="sistema_operativo" name="sistema_operativo"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                                <option value="">Seleccionar...</option>
                                <option value="Windows 10">Windows 10</option>
                                <option value="Windows 11">Windows 11</option>
                                <option value="macOS">macOS</option>
                                <option value="Linux">Linux</option>
                                <option value="Ubuntu">Ubuntu</option>
                            </select>
                        </div>


                        <!-- RAM -->
                        <div>
                            <label for="ram" class="block text-sm font-semibold text-gray-700 mb-2">
                                RAM (GB)
                            </label>
                            <input type="number" id="ram" name="ram" placeholder="Ej: 8" min="1" max="256"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                        </div>


                        <!-- Fecha de Mantenimiento -->
                        <div>
                            <label for="fecha_mantenimiento" class="block text-sm font-semibold text-gray-700 mb-2">
                                Fecha de Mantenimiento
                            </label>
                            <input type="date" id="fecha_mantenimiento" name="fecha_mantenimiento"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                        </div>
                    </div>


                    <!-- Columna Derecha -->
                    <div class="space-y-4">
                        <!-- Tipo de Equipo -->
                        <div>
                            <label for="tipo_equipo" class="block text-sm font-semibold text-gray-700 mb-2">
                                Tipo de Equipo
                            </label>
                            <select id="tipo_equipo" name="tipo_equipo"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                                <option value="">Seleccionar...</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Tablet">Tablet</option>
                                <option value="PC">PC</option>
                            </select>
                        </div>


                        <!-- Modelo -->
                        <div>
                            <label for="modelo" class="block text-sm font-semibold text-gray-700 mb-2">
                                Modelo
                            </label>
                            <select id="modelo" name="modelo"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                                <option value="">Seleccionar...</option>
                                <option value="Inspiron 15">Inspiron 15</option>
                                <option value="Pavilion 14">Pavilion 14</option>
                                <option value="ThinkPad E15">ThinkPad E15</option>
                                <option value="VivoBook 15">VivoBook 15</option>
                            </select>
                        </div>


                        <!-- Almacenamiento -->
                        <div>
                            <label for="almacenamiento" class="block text-sm font-semibold text-gray-700 mb-2">
                                Almacenamiento (GB)
                            </label>
                            <input type="number" id="almacenamiento" name="almacenamiento" placeholder="Ej: 256" min="1"
                                max="4000"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                        </div>


                        <!-- Estado -->
                        <div>
                            <label for="estado" class="block text-sm font-semibold text-gray-700 mb-2">
                                Estado (Activo/Inactivo)
                            </label>
                            <select id="estado" name="estado"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                                <option value="">Seleccionar...</option>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>


                        <!-- Fecha de Registro -->
                        <div>
                            <label for="fecha_registro" class="block text-sm font-semibold text-gray-700 mb-2">
                                Fecha de Registro
                            </label>
                            <input type="date" id="fecha_registro" name="fecha_registro"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                                required>
                        </div>
                    </div>
                </div>


                <!-- Botón Registrar -->
                <div class="mt-8 flex gap-4">
                    <button type="submit"
                        class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 transform hover:scale-105">
                        Registrar
                    </button>
                    <button type="reset"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-lg transition duration-200">
                        Limpiar
                    </button>
                </div>


                <!-- Mensaje de estado -->
                <div id="statusMessage" class="mt-4 hidden p-4 rounded-lg text-center font-semibold"></div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
